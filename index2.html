 Print numbers from 1 to 20 using a for loop.

 //Calculate the sum of all numbers from 1 to 100 using a for loop.

// Write a program to find the factorial of a number using a for loop.

let num = 5;
let factorial = 1;

for (let i = 1; i <= num; i++) {
    factorial *= i;
}
console.log(`The factorial of ${num} is ${factorial}`);

    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) {
            console.log("false")
            break; 
        }

            console.log("true")
        }

//Use a nested for loop to print a right-angled triangle pattern of stars (*) for n rows.

 let n = Number(prompt("Enter number of rows:"));

}


//Write a program to reverse a string using a for loop (without using built-in reverse methods).

let text = prompt("Enter a string:");

}


// Write a program to find the sum of digits of a number using a for loop.
let num = prompt("Enter a number:");
let sum = 0;
for (let i = 0; i < num.length; i++) {
    sum += Number(num[i]);}
console.log(`The sum of digits is: ${sum}`);
